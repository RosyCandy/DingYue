<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>微信登录回调</title>
<style>
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; background: #f9f9fe; display: flex; align-items: center; justify-content: center; min-height: 100vh; color: #1a1c1f; }
  .card { text-align: center; padding: 24px; }
  .spinner { width: 32px; height: 32px; border: 3px solid #e0e0f0; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
  .desc { font-size: 13px; color: #414755; line-height: 1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="spinner"></div>
  <div class="title">正在打开 DingYue...</div>
  <div class="desc">微信授权成功，即将返回应用</div>
</div>
<script>
  (function () {
    var params = new URLSearchParams(location.search);
    var code = params.get('code');
    var state = params.get('state');
    var fallback = params.get('fallback') || location.href;
    if (!code) {
      location.href = fallback;
      return;
    }
    var ua = navigator.userAgent;
    var toHome = function () {
      location.href = location.origin + '/?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || '');
    };
    // 正在 App 自己的 WebView 里（UA 带 DingYueNative 标记，见 capacitor.config.ts）：
    // Capacitor 的 JS 桥只注入 App origin，外部页面没有监听深链的能力，直接导航回
    // 应用入口把 code 交给 React 应用消费。安卓 scheme 是 https://localhost，
    // iOS 是 capacitor://localhost（按 UA 覆盖串区分）。
    if (ua.indexOf('DingYueNative') !== -1) {
      var appOrigin = ua.indexOf('Macintosh') !== -1 ? 'capacitor://localhost' : 'https://localhost';
      location.replace(appOrigin + '/?code=' + encodeURIComponent(code) + '&state=' + encodeURIComponent(state || ''));
      return;
    }
    if (/Android|iPhone|iPad|Mobile/i.test(ua)) {
      // 移动端内置浏览器：优先尝试深链返回 App（provider 信息编码在 state 前缀里，
      // 见 socialAuth.ts）；没有安装 App 时 1.5s 后回退到站点首页由 Web 端消费 code。
      // 深链成功后页面转入后台，回退导航对 App 无影响。
      var scheme = 'duoduoapp://czl-callback?code=' + encodeURIComponent(code);
      if (state) scheme += '&state=' + encodeURIComponent(state);
      setTimeout(toHome, 1500);
      location.href = scheme;
      return;
    }
    // 桌面浏览器无法唤起 App，直接回首页消费 code
    toHome();
  })();
</script>
</body>
</html>
