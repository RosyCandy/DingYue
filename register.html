<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>注册 · DingYue</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <style>
      /* 与 index.html 同款品牌启动骨架 */
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f5f3ec;
        font-family: -apple-system, "PingFang SC", "MiSans", "Microsoft YaHei", sans-serif;
      }
      #boot-splash .boot-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        box-shadow: 0 4px 16px rgba(30, 30, 30, 0.08);
      }
      #boot-splash .boot-name {
        font-size: 14px;
        font-weight: 700;
        color: #1a1c1f;
      }
      #boot-splash .boot-spinner {
        width: 22px;
        height: 22px;
        border: 3px solid #e3e0d6;
        border-top-color: #8f6bc8;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <img class="boot-logo" src="/icon.png" alt="" />
      <div class="boot-name">DingYue 订阅管理助手</div>
      <div class="boot-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/login-main.tsx"></script>
  </body>
</html>
